name: Deploy catálogo (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Build (core + cli)
        run: npm run build

      - name: Gerar índice e dados do site
        run: |
          npm run generate:registry
          node packages/cli/dist/index.js targets --json > packages/catalog/targets.json

      - name: Montar _site
        run: |
          mkdir -p _site/catalog
          cp -R packages/web/. _site/
          cp packages/catalog/registry.json _site/registry.json
          cp packages/catalog/targets.json _site/targets.json
          # conteúdo dos artefatos (para o painel de detalhe)
          for d in skills agents prompts instructions; do
            if [ -d "packages/catalog/$d" ]; then cp -R "packages/catalog/$d" "_site/catalog/$d"; fi
          done
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
